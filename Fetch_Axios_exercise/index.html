<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quản lý người dùng</h1>
        
        <!-- form them user -->
        <div class="form-section">
            <h2>Thêm người dùng mới</h2>
            <form id="addUserForm">
                <input type="text" id="addName" placeholder="Tên" required>
                <input type="email" id="addEmail" placeholder="Email" required>
                <input type="tel" id="addPhone" placeholder="Số điện thoại" required>
                <button type="submit">Thêm</button>
            </form>
        </div>

        <!-- form tim kiem -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên...">
        </div>

        <!-- bang hien thi users -->
        <div class="table-section">
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên</th>
                        <th>Email</th>
                        <th>Số điện thoại</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- du lieu se duoc them bang javascript -->
                </tbody>
            </table>
        </div>

        <!-- phan trang -->
        <div class="pagination">
            <button id="prevBtn">Trước</button>
            <span id="pageInfo">Trang 1</span>
            <button id="nextBtn">Sau</button>
        </div>

        <!-- popup chinh sua -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Chỉnh sửa người dùng</h2>
                <form id="editUserForm">
                    <input type="hidden" id="editId">
                    <input type="text" id="editName" placeholder="Tên" required>
                    <input type="email" id="editEmail" placeholder="Email" required>
                    <input type="tel" id="editPhone" placeholder="Số điện thoại" required>
                    <button type="submit">Cập nhật</button>
                </form>
            </div>
        </div>

        <!-- thong bao loi -->
        <div id="errorMessage" class="error-message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
